{% extends 'vehicles/base.html' %}
{% block content %}
<h1>Confirm delete</h1>
<p>Are you sure you want to delete "{{ object }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>

<a href="{% url 'vehicles:vehicle_list' %}">Cancel</a>
{% endblock %}
