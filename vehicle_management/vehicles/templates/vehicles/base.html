<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Management</title>
</head>
<body>
    <div>
        {% if user.is_authenticated %}
            Logged in as {{ user.username }} ({{ user.role }}) |
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
    <hr>
    {% if messages %}
      <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
